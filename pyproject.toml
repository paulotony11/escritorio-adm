[project]
name = "escritorio-adm"
version = "0.1.0"
description = "Ferramentas de apoio ao administrativo do escritório (honorários, cobrança, conciliação)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "docxtpl>=0.18",
    "pydantic>=2.7",
    "validate-docbr>=1.10",
    "num2words>=0.5.13",
    "holidays>=0.50",
    "python-dateutil>=2.9",
    "ofxtools>=0.9",
    "duckdb>=1.0",
    "jinja2>=3.1",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
